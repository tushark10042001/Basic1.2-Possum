<!DOCTYPE html>
<html>
<head>
    <title>Age Prediction</title>
</head>

<body>

    <h1>Age Prediction</h1>

    <form action="/predict" method="post">

        <label>Site:</label>
        <input type="text" name="site" required>
        <br><br>

        <label>Pop:</label>
        <input type="text" name="Pop" required>
        <br><br>

        <label>Sex:</label>
        <input type="text" name="sex" required>
        <br><br>

        <label>Head Length:</label>
        <input type="number" step="any" name="hdlngth" required>
        <br><br>

        <label>Skull Width:</label>
        <input type="number" step="any" name="skullw" required>
        <br><br>

        <label>Total Length:</label>
        <input type="number" step="any" name="totlngth" required>
        <br><br>

        <label>Tail Length:</label>
        <input type="number" step="any" name="taill" required>
        <br><br>

        <label>Foot Length:</label>
        <input type="number" step="any" name="footlgth" required>
        <br><br>

        <label>Ear Length:</label>
        <input type="number" step="any" name="earconch" required>
        <br><br>

        <label>Eye:</label>
        <input type="number" step="any" name="eye" required>
        <br><br>

        <label>Chest:</label>
        <input type="number" step="any" name="chest" required>
        <br><br>

        <label>Belly:</label>
        <input type="number" step="any" name="belly" required>
        <br><br>

        <button type="submit">Predict Age</button>

    </form>

    {% if prediction %}
        <h2>Predicted Age: {{ prediction }}</h2>
    {% endif %}

</body>
</html>
